# Copiez ce fichier en « config.ini » puis remplissez-le.
# (config.ini n'est jamais envoyé sur Git : il contient le mot de passe.)

[gazette]
titre = La Gazette de Noël
# Dossier qui contient photos/, histoires/, traditions/, recettes/, phrases/, enigmes/
#   Synology : /volume1/Gazette
#   PC Windows : C:\Users\MonNom\Documents\Gazette
#   Pour un essai avec les exemples fournis : exemples
dossier_contenu = /volume1/Gazette
# Pas d'envoi avant cette heure (le programme peut être lancé plusieurs fois, il n'envoie qu'une fois par jour)
heure_envoi = 08:00
# Photos déjà rangées ailleurs sur le NAS : un dossier par ligne (lignes suivantes décalées d'un espace).
# Les sous-dossiers sont inclus. Laisser vide pour utiliser le dossier « photos » du dossier de contenu.
# Pour trouver le chemin : File Station → clic droit sur le dossier → Propriétés → Emplacement.
dossiers_photos =
#   /volume1/photo/Noël
#   /volume1/photo/Vacances
#   /volume1/homes/MonNom/Photos/2019
# Afficher le nom du dossier de la photo sous l'image (ex. « Vacances 2019 ») : oui / non
afficher_dossier_photo = oui

[mail]
# Adresse affichée comme expéditeur (avec Brevo : une adresse validée dans Brevo → Expéditeurs)
expediteur = gazette.de.noel@gmail.com
nom_expediteur = La Gazette de Noël
# Séparés par des virgules
destinataires = toi@example.com, yannick@example.com

# --- Option A : Brevo (recommandé) -------------------------------------------
# Brevo → menu en haut à droite → « SMTP & API » → onglet « SMTP »
serveur = smtp-relay.brevo.com
port = 587
# « Identifiant » affiché par Brevo (du type 123abc@smtp-brevo.com)
identifiant = 123abc@smtp-brevo.com
# Une « clé SMTP » (bouton « Générer une nouvelle clé SMTP »), PAS la clé API
mot_de_passe = xsmtpsib-xxxxxxxxxxxxxxxx

# --- Option B : Gmail ----------------------------------------------------------
# serveur = smtp.gmail.com
# port = 465
# identifiant =            (laisser vide : c'est l'adresse expéditeur)
# mot_de_passe = abcd efgh ijkl mnop   (mot de passe d'application à 16 lettres)
